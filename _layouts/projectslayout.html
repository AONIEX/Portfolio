<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      body {
        color: white;
        background-image:
          radial-gradient(circle at center, rgba(0, 0, 0, 0.3) 0%, rgba(0, 0, 0, 0.3) 20%, rgba(0, 0, 0, 0) 21%),
          url('{{ "/Assets/Bg8.webp" | relative_url }}');
        background-size: cover;
        background-repeat: no-repeat;
        background-attachment: fixed;
        background-color: #001f3f;
      }

      /* Expanded layout width */
      .wrapper {
        width: 88% !important;
        max-width: 1400px !important;
        margin: 0 auto !important;
        padding-top: 20px;
      }

      header {
        width: 280px !important; /* Left sidebar width */
        float: left !important;
      }

      section {
        width: calc(100% - 320px) !important; /* Main content area */
        float: right !important;
      }

      /* ========================================================= */
      /* IN-PAGE PROJECT JUMP BUTTONS (from markdown project-nav)  */
      /* ========================================================= */
      .project-nav {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5em;
        justify-content: center;
        margin-bottom: 1em;
      }

      .project-nav a {
        text-decoration: none;
      }

      .project-button {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0.4em 1.4em;
        background: rgba(0, 0, 0, 0.4);
        border: 1px solid #00aaff;
        border-radius: 6px;
        color: white;
        transition: transform 0.3s ease, background-color 0.3s ease;
      }

      .project-button:hover {
        transform: scale(1.05);
        background: rgba(0, 170, 255, 0.25);
      }

      .project-text h5 {
        margin: 0;
        font-size: 0.9em;
        white-space: nowrap;
      }

      /* Left Sidebar Button Hover Effect */
      .site-nav a:hover > div {
        transform: scale(1.03);
        background: rgba(0, 170, 255, 0.2) !important;
      }

      /* Apply white text to key containers */
      .markdown-body,
      .post-content,
      .content,
      .wrapper section,
      header,
      footer,
      nav,
      p,
      li {
        color: white;
        background: transparent;
      }

      h1, h2, h3, h4, h5 {
        color: white !important;
        text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        background: transparent !important;
      }

      a {
        color: #00aaff;
        text-decoration: underline;
        transition: color 0.3s ease;
      }

      a:visited {
        color: #0077cc;
      }

      a:hover {
        color: #66ccff;
      }

      .divider {
        border-top: 2px solid #00aaff;
        margin: 2em 0;
        opacity: 0.6;
      }

      html {
        scroll-behavior: smooth;
      }

      @media screen and (max-width: 960px) {
        .wrapper {
          width: 95% !important;
        }
        header, section {
          width: 100% !important;
          float: none !important;
        }
      }
    </style>
